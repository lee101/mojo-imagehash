[project]
name = "mojo-imagehash"
version = "0.1.0"
description = "Perceptual image hashing accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "imagehash", "perceptual-hash", "image-similarity"]
dependencies = ["numpy", "Pillow", "PyWavelets"]

[project.optional-dependencies]
dev = ["pytest", "ImageHash", "scipy"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-imagehash"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
